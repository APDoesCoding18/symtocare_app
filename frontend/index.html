<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SymptoCare — Smart Healthcare</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header>
        <h1>SymptoCare</h1>
        <nav>
            <a href="#" id="nav-search" class="nav-link active">Search Doctors</a>
            <a href="#" id="nav-appointments" class="nav-link">My Appointments</a>
            <a href="#" id="nav-inbox" class="nav-link">Inbox</a>
            <a href="profile.html" id="nav-profile" class="nav-link">My Profile</a>
            <a href="#" id="nav-dashboard" class="nav-link">Doctor Dashboard</a>
            <a href="#" id="nav-logout" class="nav-link logout-btn">Logout</a>
        </nav>
    </header>

    <div class="container">
        <!-- Search View -->
        <div id="search-view">
            <main>
            <aside class="search-panel">
                <h2>Find a Specialist</h2>
                <form id="search-form">
                    <div class="form-group">
                        <label for="specialization">Specialization</label>
                        <select id="specialization">
                            <option value="">All Specialties</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="city">City</label>
                        <input id="city" type="text" placeholder="e.g., Mumbai" />
                    </div>
                    <div class="form-group">
                        <label for="symptoms">Symptoms (Optional)</label>
                        <input id="symptoms" type="text" placeholder="e.g., headache, fever" />
                    </div>
                    <button type="submit">Search Doctors</button>
                </form>
            </aside>

                <section class="results-panel" id="results"></section>
            </main>
        </div>

        <!-- Appointments View -->
        <div id="appointments-view" class="hidden">
            <h2>My Appointments</h2>
            <div id="patient-appointments-list"></div>
        </div>

        <!-- Inbox View -->
        <div id="inbox-view" class="hidden">
            <h2>My Inbox</h2>
            <div id="inbox-messages-list"></div>
        </div>

        <!-- Doctor Dashboard View -->
        <div id="doctor-dashboard-view" class="hidden">
            <div class="dashboard-header">
                <h2>Doctor Dashboard</h2>
                <label for="doctor-select">Select Your Name:</label>
                <select id="doctor-select"></select>
            </div>
            <div id="doctor-appointments-list"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
